[project]
name = "devin-for-aws-bedrock-connector"
version = "0.1.0"
description = "Demo: a Devin-style agent whose inference runs entirely on Amazon Bedrock, with ACU metering"
requires-python = ">=3.10"
dependencies = ["boto3>=1.39", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
agentcore = ["bedrock-agentcore>=1.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
bedrock-connector = "bedrock_connector.cli:main"

[tool.setuptools]
packages = ["bedrock_connector"]

[tool.setuptools.package-data]
bedrock_connector = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
